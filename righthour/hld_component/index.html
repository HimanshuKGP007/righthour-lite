<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap');
:root{ --navy:#14284B; --navy-d:#0C1A33; --navy-60:#4D6488; --navy-30:#A7B4CA; --navy-10:#EDF1F6; --navy-05:#F5F7FA;
  --ink:#1B2230; --muted:#5B6474; --rule:#DDE3EC; --red:#B83A2E; --green:#2F7350; --amber:#D9A21B; --amber-t:#8A6414;
  --green-bg:#EAF4EE; --red-bg:#FBEDEB; --ease:cubic-bezier(.16,1,.3,1); }
html,body{ margin:0; padding:0; background:transparent; font-family:Geist,system-ui,sans-serif; }
#root{ background:#fff; border:1px solid var(--rule); border-radius:14px; padding:14px; box-sizing:border-box; overflow-x:auto; }
/* ---------- architecture diagram */
.dg-wrap { background:#fff; border:1px solid var(--rule); border-radius:14px; padding:14px; box-shadow:var(--sh2); overflow-x:auto; }
svg.dg { width:100%; min-width:820px; height:auto; display:block; font-family: Geist, system-ui, sans-serif; }
.dg-panel { fill:none; stroke:var(--navy-30); stroke-width:1.2; stroke-dasharray:2 3; } .dg-panel.p2 { fill:var(--navy-05); }
.dg-pipe { fill:var(--navy-10); stroke:var(--navy-30); stroke-width:1; }
.dg-pl { font-size:11.5px; font-weight:650; letter-spacing:.09em; fill:var(--navy); } .dg-pt { font-size:16px; font-weight:650; fill:var(--navy); }
.dg-ln { stroke:var(--navy); stroke-width:1.6; } .dg-dash { stroke:var(--navy-60); stroke-width:1.6; stroke-dasharray:6 5; } .dg-dash.gold { stroke:var(--amber-t); }
.dg-dash.on { stroke:var(--green); stroke-dasharray:none; } .dg-dash.gold.on { stroke:var(--amber-t); stroke-dasharray:none; }
.dg-loop { font-size:13px; font-weight:600; fill:var(--navy-60); } .dg-loop.gold { fill:var(--amber-t); }
.dg-box rect { fill:#fff; stroke:var(--navy); stroke-width:1.4; } .dg-box.pipe rect { fill:#fff; stroke:var(--navy-30); }
.dg-box.dark rect { fill:var(--navy); } .dg-box.green rect { fill:var(--green-bg); stroke:var(--green); } .dg-box.human rect { stroke:var(--green); stroke-width:1.8; }
.dg-t { font-size:15px; font-weight:650; fill:var(--ink); } .dg-s { font-size:12px; fill:var(--muted); }
.dg-box.dark .dg-t { fill:#fff; } .dg-box.dark .dg-s { fill:#D6DEEC; } .dg-box.green .dg-t { fill:var(--green); }
.dg-code { font-family:'Geist Mono', monospace; font-size:10.5px; fill:var(--navy-60); } .dg-box.dark .dg-code { fill:#A7B4CA; }
.dg-box .dot { fill:#fff; stroke:var(--navy-30); stroke-width:1.5; }
.dg-box.s-ran .dot { fill:var(--green); stroke:var(--green); } .dg-box.s-ask .dot { fill:var(--red); stroke:var(--red); }
.dg-box.s-wait { opacity:.62; } .dg-box.s-ask rect { stroke:var(--red); stroke-width:2; }

/* clickable behaviour */
[data-id]{ cursor:pointer; outline:none; }
.dg-box{ transition: transform .18s var(--ease), filter .18s var(--ease); transform-box:fill-box; transform-origin:center; }
.dg-box:hover{ transform:translateY(-2px); filter:drop-shadow(0 6px 8px rgba(12,26,51,.18)); }
.dg-box:hover rect{ stroke-width:2; }
.dg-box.s-wait:hover{ opacity:.9; }
[data-id]:focus-visible rect, .dg-hit:focus-visible .ring{ stroke:var(--navy); stroke-width:3; stroke-dasharray:none; }
.dg-box:focus-visible{ outline:2px solid var(--navy); outline-offset:3px; border-radius:8px; }
.dg-box.sel rect{ stroke:var(--amber); stroke-width:3.2; }
.dg-box.sel{ filter:drop-shadow(0 0 0 transparent) drop-shadow(0 4px 10px rgba(217,162,27,.45)); opacity:1; }
.dg-hit .hit{ stroke:transparent; stroke-width:22; fill:none; pointer-events:stroke; }
.dg-hit:hover .dg-dash{ stroke-width:2.6; } .dg-hit:hover .dg-loop{ text-decoration:underline; }
.dg-hit.sel .dg-dash{ stroke:var(--amber); stroke-width:3.2; } .dg-hit.sel .dg-loop{ fill:var(--amber-t); font-weight:700; }
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{ transition:none !important; animation:none !important; } .dg-box:hover{ transform:none; } }
</style></head>
<body><div id="root" role="group" aria-label="Architecture diagram. Select a box for details."></div>
<style id="extra"></style>
<script>
(function(){
  var root = document.getElementById('root'), extra = document.getElementById('extra');
  var selected = null, lastSvg = null, localPick = null;
  function send(type, data){ window.parent.postMessage(Object.assign({isStreamlitMessage:true, type:type}, data||{}), '*'); }
  function setHeight(){ send('streamlit:setFrameHeight', {height: Math.ceil(root.getBoundingClientRect().height) + 4}); }
  function mark(){
    root.querySelectorAll('[data-id]').forEach(function(el){
      el.classList.toggle('sel', el.getAttribute('data-id') === selected);
      el.setAttribute('aria-pressed', el.getAttribute('data-id') === selected ? 'true' : 'false');
    });
  }
  function pick(id){ selected = id; localPick = id; mark(); send('streamlit:setComponentValue', {value:id, dataType:'json'}); }
  function wire(){
    root.querySelectorAll('[data-id]').forEach(function(el){
      var id = el.getAttribute('data-id'), t = el.querySelector('title');
      el.setAttribute('tabindex','0'); el.setAttribute('role','button');
      el.setAttribute('aria-label', (t ? t.textContent : id) + '. Select for details.');
      el.addEventListener('click', function(){ pick(id); });
      el.addEventListener('keydown', function(e){ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); pick(id); } });
    });
  }
  window.addEventListener('message', function(ev){
    var d = ev.data; if(!d || d.type !== 'streamlit:render') return;
    var a = d.args || {};
    extra.textContent = a.css || '';
    // a click is authoritative until the server's selection catches up with it
    if(localPick && a.selected === localPick){ localPick = null; }
    selected = localPick || a.selected || null;
    if(a.svg !== lastSvg){ root.innerHTML = a.svg || ''; lastSvg = a.svg; wire(); }
    mark(); setHeight();
  });
  window.addEventListener('resize', setHeight);
  send('streamlit:componentReady', {apiVersion:1});
})();
</script></body></html>
